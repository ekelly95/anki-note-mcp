name: Release

# Publishing is driven by a tag rather than a button, so that what reaches PyPI
# is always a named point in the history. `ci.yml` triggers on `push: branches`,
# which a tag push does not match — so the guards protecting the artefact are
# repeated here rather than assumed to have run.
#
# PyPI trusts exactly one publisher for `anki-note-mcp`: owner `ekelly95` /
# repository `anki-note-mcp` / workflow `release.yml` / environment `pypi`, and
# that GitHub environment exists. Renaming this file or that environment breaks
# publishing with an authentication error that looks nothing like the cause.
#
# Pushing a `v*` tag before all of that exists does not fail early: `build` goes
# green and `publish` then fails at the OIDC exchange. Do not tag to test this
# workflow.
on:
  push:
    tags: ["v*"]

# Two tags pushed in quick succession would otherwise race two uploads at the
# same project. Not cancel-in-progress: a half-finished upload is worse than a
# queued one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      # A version number can never be re-used on PyPI, and a tag pointing at a
      # commit that was never on `main` would skip the matrix entirely. Both are
      # cheaper to catch here than after an upload that cannot be taken back.
      - name: The tag names the version being built
        run: |
          version=$(uv run python -c "import anki_mcp; print(anki_mcp.__version__)")
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $tag does not match __version__ $version"
            exit 1
          fi
      # A release whose notes were never written is a version nobody can find
      # the changes for. Checked against the heading form CHANGELOG.md uses,
      # `## 0.1.0 — 2026-10-08`: the first two words of a line, compared as a
      # fixed string, so the version's dots cannot match any character.
      - name: The changelog has a heading for this version
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! cut -d' ' -f1,2 CHANGELOG.md | grep -qxF "## $version"; then
            echo "::error::CHANGELOG.md has no '## $version' heading"
            exit 1
          fi
      # Lint and types run here as well as in `ci.yml`, because a tag can point
      # at a commit that never reached `main` and so never met those gates. The
      # wheel ships `py.typed`: the annotations are a promise to everyone who
      # installs it, and an unchecked one is worse than none.
      - name: Formatting
        run: uv run ruff format --check src
      - name: Lint
        run: uv run ruff check src
      - name: Types
        run: uv run mypy src
      - name: Tests, on the exact commit being published
        run: |
          uv run coverage run -m pytest
          uv run coverage report
      - run: uv build
      - name: Metadata is well formed
        run: uvx twine check dist/*
      - name: No tests escaped into the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          leaked = [n for n in names if n.endswith("_test.py") or "/testing/" in n]
          if leaked:
              print(f"::error::test modules leaked into the wheel: {leaked}")
              sys.exit(1)
          PY
      - name: The typing marker shipped
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "anki_mcp/py.typed" in names, names
          PY
      # The strongest gate here: build output that imports on the dev machine
      # still proves nothing about a machine that only has the wheel. This
      # installs it outside the checkout and speaks the actual protocol to it.
      # It needs no Anki — the client is constructed at startup but connects
      # only when a tool is called — which is exactly why it is cheap enough to
      # run on every push.
      - name: Install the wheel elsewhere and speak MCP to it
        run: |
          mkdir -p /tmp/scratch && cd /tmp/scratch
          python -m venv .venv
          .venv/bin/python -m pip install --quiet "$(ls $GITHUB_WORKSPACE/dist/*.whl)"
          .venv/bin/python - <<'PY'
          import json, subprocess, sys
          from importlib.metadata import version

          expected = version("anki-note-mcp")
          # encoding is explicit rather than inherited: text=True decodes the
          # pipe with the locale codec, which on Windows is cp1252 and raises on
          # any non-ASCII character in a reply the server wrote correctly. This
          # job runs on Linux where the default is already UTF-8, so the pin is
          # for whoever copies this script to a machine where it is not.
          proc = subprocess.Popen(
              [".venv/bin/anki-mcp"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True, encoding="utf-8",
          )
          request = {
              "jsonrpc": "2.0", "id": 1, "method": "initialize",
              "params": {
                  "protocolVersion": "2025-06-18",
                  "capabilities": {},
                  "clientInfo": {"name": "ci", "version": "0"},
              },
          }
          out, err = proc.communicate(json.dumps(request) + "\n", timeout=60)
          reply = next((json.loads(line) for line in out.splitlines() if line.strip()), None)
          if reply is None:
              print(f"::error::no reply on stdout. stderr was: {err}")
              sys.exit(1)
          info = reply["result"]["serverInfo"]
          assert info["name"] == "anki-mcp", info
          # Compared against the installed distribution's own metadata, because
          # FastMCP's constructor takes no version: without the assignment in
          # build_server this silently reports the MCP SDK's version instead,
          # and any check that merely asserts the field is non-empty passes.
          assert info["version"] == expected, f"expected {expected}, got {info}"
          print("initialize ->", info)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: GitHub proves its own identity to PyPI at the moment
    # of upload, so no API token exists anywhere to be stored or leaked.
    #
    # Uploading is a separate job because `id-token: write` *is* the credential.
    # Keeping it on a job that only downloads a file and posts it means no build
    # or test code ever runs beside the ability to mint one.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
